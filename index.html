<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Giới Thiệu Tương Tác</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease;
        }
        header, nav, main, footer {
            padding: 15px 20px;
            text-align: center;
        }
        header { background-color: #333; color: white; }
        nav { background-color: #444; }
        nav a { color: white; margin: 0 10px; text-decoration: none; }
        main { min-height: 300px; padding: 40px 20px; }
        footer { background-color: #222; color: #ccc; }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Trang Cá Nhân</h1>
    </header>

    <nav>
        <a href="#">Trang chủ</a>
        <a href="#">Giới thiệu</a>
        <a href="#">Liên hệ</a>
    </nav>

    <main id="main-content">
        <h2 id="greeting">Đang tải lời chào...</h2>
        <p>Chào mừng bạn đến với trang cá nhân tương tác đơn giản!</p>
        <button id="btn-change-bg">Đổi màu nền</button>
    </main>

    <footer>
        <p>&copy; 2026 Trang cá nhân. All rights reserved.</p>
    </footer>

    <script>
        // 1. Thao tác DOM bằng getElementById
        const greetingEl = document.getElementById("greeting");
        const btnChangeBg = document.getElementById("btn-change-bg");

        // 2. Hiển thị lời chào theo buổi dùng đối tượng Date
        function setGreeting() {
            const currentHour = new Date().getHours();
            let greetingText = "";

            if (currentHour >= 5 && currentHour < 12) {
                greetingText = "Chào buổi sáng! ☀️";
            } else if (currentHour >= 12 && currentHour < 18) {
                greetingText = "Chào buổi chiều! 🌤️";
            } else {
                greetingText = "Chào buổi tối! 🌙";
            }

            greetingEl.innerText = greetingText;
        }

        // Gọi hàm hiển thị lời chào khi trang được tải
        setGreeting();

        // 3. Đổi màu nền ngẫu nhiên bằng addEventListener & .style
        const colors = ["#f4f4f4", "#e3f2fd", "#e8f5e9", "#fff3e0", "#fce4ec"];
        
        btnChangeBg.addEventListener("click", function() {
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            document.body.style.backgroundColor = randomColor;
        });
    </script>
</body>
</html>
